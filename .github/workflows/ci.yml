name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Install rtk (real-binary tests)
        run: node scripts/install-rtk.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Mods import and their factories run
        run: |
          npm i -g command-code@latest
          node scripts/verify-mods.ts
